<!DOCTYPE html>
<html>
<head>
  <title>Countdown</title>
  <style>
    body {
      margin: 0;
      background: black;
      overflow: hidden;
    }
  </style>

  <!-- IMPORTANT: Three.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

</head>
    <body>
        <div id="countdown"></div>
        <script>
            
            var countdownDate = new Date("june 15, 2026 16:58").getTime();
            // Update the countdown every 1 second
            var now = new Date().getTime();
            
            // Calculate the distance between now and the countdown date
            var distance = Math.floor((countdownDate - now) / 1000);
            
            // Time calculations for days, hours, minutes, and seconds
            // var days = Math.floor(distance / (1000 * 60 * 60 * 24));
            // var hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            // var minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            // var seconds = Math.floor((distance % (1000 * 60)) / 1000);

            // Display the result in the element with id="countdown"

            let countdownValue = distance

            const scene = new THREE.Scene();
            
            const camera = new THREE.OrthographicCamera(
              window.innerWidth / -2,
              window.innerWidth / 2,
              window.innerHeight / 2,
              window.innerHeight / -2,
              1,
              1000
            );
            camera.position.z = 10;
            
            const renderer = new THREE.WebGLRenderer({ alpha:true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById("countdown").appendChild(renderer.domElement);
            
            /////////////////////////////////////////////////
            // OUTER RINGS
            /////////////////////////////////////////////////
            
            const ring1 = new THREE.Mesh(
              new THREE.RingGeometry(220, 230, 64),
              new THREE.MeshBasicMaterial({ color: 0xffffff })
            );
            scene.add(ring1);
            
            const ring2 = new THREE.Mesh(
              new THREE.RingGeometry(140, 150, 64),
              new THREE.MeshBasicMaterial({ color: 0xffffff })
            );
            scene.add(ring2);
            
            /////////////////////////////////////////////////
            // CROSS LINES
            /////////////////////////////////////////////////
            
            function makeLine(x1,y1,x2,y2){
              const material = new THREE.LineBasicMaterial({ color: 0xffffff });
              const points = [];
              points.push(new THREE.Vector3(x1,y1,0));
              points.push(new THREE.Vector3(x2,y2,0));
              const geometry = new THREE.BufferGeometry().setFromPoints(points);
              return new THREE.Line(geometry, material);
            }
            
            scene.add(makeLine(-250,0,250,0));
            scene.add(makeLine(0,-250,0,250));
            
            /////////////////////////////////////////////////
            // COUNTDOWN NUMBER TEXTURE
            /////////////////////////////////////////////////
            
            let numberMesh;
            
            function createNumberTexture(num){
              const canvas = document.createElement("canvas");
              canvas.width = 512;
              canvas.height = 512;
              const ctx = canvas.getContext("2d");
            
              ctx.fillStyle = "rgba(0,0,0,0)";
              ctx.fillRect(0,0,512,512);
            
              ctx.fillStyle = "white";
              ctx.font = "bold 8em Arial";
              ctx.textAlign = "center";
              ctx.textBaseline = "middle";
              ctx.fillText(num,256,256);
            
              const texture = new THREE.CanvasTexture(canvas);
              return texture;
            }
            
            function updateNumber(){
              if(numberMesh) scene.remove(numberMesh);
            
              const tex = createNumberTexture(countdownValue);
              const mat = new THREE.MeshBasicMaterial({
                map: tex,
                transparent: true
              });
            
              const geo = new THREE.PlaneGeometry(180,180);
              numberMesh = new THREE.Mesh(geo, mat);
              scene.add(numberMesh);
            }
            
            updateNumber();
            
            /////////////////////////////////////////////////
            // SWEEP WIPE
            /////////////////////////////////////////////////
            
            const wipeGeometry = new THREE.CircleGeometry(230, 64, 0, Math.PI/2);
            const wipeMaterial = new THREE.MeshBasicMaterial({
              color: 0xffffff,
              transparent:true,
              opacity:0.25
            });
            const wipe = new THREE.Mesh(wipeGeometry, wipeMaterial);
            scene.add(wipe);
            
            /////////////////////////////////////////////////
            // TIMER
            /////////////////////////////////////////////////
            
            let lastSwitch = Date.now();
            
            function animate(){
              requestAnimationFrame(animate);
            
              // rotate wipe
              wipe.rotation.z -= 0.05;
            
              // every second switch number
              if(Date.now() - lastSwitch > 1000){
                countdownValue--;
            
                if(countdownValue <= 0){
                  countdownValue = 0;
                }
            
                updateNumber();
                lastSwitch = Date.now();
              }
            
              renderer.render(scene,camera);
            }
            
            animate();
        </script>        
    </body>
</html>
